name: Pages

# Publishes the Joker Calculator (web/) to GitHub Pages (EPIC-07 Phase 4).
# Only from main, and only after the same tests as CI's `component` job pass
# on this build, so a broken page never deploys.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits rather than cancelling a deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and test the page
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-wasip2
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
      - run: cargo build -p buffoonery-component --target wasm32-wasip2 --profile component
      # The page's tests open links the CLI prints.
      - run: cargo build -p buffoonery-cli
      - run: npm ci
        working-directory: component/js
      - run: npm test
        working-directory: component/js
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npx vite build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
