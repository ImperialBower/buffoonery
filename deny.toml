# Configuration for cargo-deny
# https://embarkstudios.github.io/cargo-deny/
#
# `cargo deny check` (no args) runs advisories + bans + licenses + sources.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
# The crate's own license plus only what direct + transitive dependencies
# actually need. Add entries as new dependencies require them.
allow = [
    "Apache-2.0",
    # unicode-ident (via serde_derive) is "(MIT OR Apache-2.0) AND Unicode-3.0".
    "Unicode-3.0",
]
confidence-threshold = 0.8
exceptions = [
    # The YAML parser under serde_norway (the `yaml` feature). MIT only, so
    # it is allowed by name rather than allowing MIT for every crate.
    { allow = ["MIT"], crate = "unsafe-libyaml-norway" },
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
allow = []
deny = []
# cardpack 0.11.1 depends on getrandom 0.3 (for its wasm_js feature) while
# rand 0.10 uses getrandom 0.4. Drop these when cardpack moves to 0.4.
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
