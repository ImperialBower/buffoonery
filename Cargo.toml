[workspace]
# The WIT component (EPIC-05 Story 4) is an adapter over this crate. It lives
# in its own crate so the engine carries no wit-bindgen or JSON code. The CLI
# (EPIC-07) is a second door over the component's adapter functions.
members = [".", "component", "cli"]

[package]
name = "buffoonery"
description = "A Balatro-style card engine and solver foundation, built on cardpack"
version = "0.0.1"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
repository = "https://github.com/ImperialBower/buffoonery"
keywords = ["balatro", "cards", "solver"]
categories = ["game-development"]

[dependencies]
cardpack = { version = "0.11.2", features = ["std", "serde"] }
log = "0.4"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
# The same YAML crate and version cardpack's `yaml` feature uses, so the
# graph never carries two YAML stacks.
serde_norway = { version = "0.9.42", optional = true }

[features]
default = ["yaml"]
# Load and write a `BoardSpec` as YAML. Off, the crate has no YAML code.
yaml = ["dep:serde_norway"]

[dev-dependencies]
env_logger = "0.11"
rstest = "0.28"
serde_json = "1"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

# Small wasm for the WIT component (EPIC-05 Story 4):
# `cargo build -p buffoonery-component --target wasm32-wasip2 --profile component`.
# A profile of its own, so the engine's release build is unchanged.
[profile.component]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
